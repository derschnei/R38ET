[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r38et-mesh"
version = "0.1.0"
description = "Peer-to-peer decentralized, resilient, human Web of Trust for democratic bottom-up decision-making over Reticulum."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "R38ET Contributors" }]
requires-python = ">=3.10"
keywords = ["mesh", "reticulum", "wot", "governance", "catala", "commons", "post-growth"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Topic :: Communications",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "rns>=0.9.0",
  "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[project.scripts]
sp0t-node = "sp0t_node:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
